name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Сборка Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download ffmpeg-kit AAR
        run: |
          mkdir -p app/libs
          echo "Скачиваем ffmpeg-kit AAR (16KB page-aligned, LTS Full GPL)..."
          curl -L -f -o app/libs/ffmpeg-kit.aar \
            "https://github.com/VineshChauhan24/ffmpeg-kit-android-16kb-lts-full-gpl/releases/download/v1.0.7/ffmpeg-kit-android-lib-release.aar"
          echo "Размер AAR: $(stat -c%s app/libs/ffmpeg-kit.aar) байт"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-uniqueizer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
